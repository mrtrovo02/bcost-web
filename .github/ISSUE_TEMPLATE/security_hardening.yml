name: Frontend security hardening
description: Track frontend security, session, demo separation, CI, or supply-chain improvements.
title: "security(web): "
labels:
  - security
  - frontend
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth/session
        - Demo separation
        - Tenant/company context
        - Billing/paywall
        - Fiscal/tax UI
        - CI/CD
        - Supply chain
        - Observability
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk being reduced
      description: Describe the abuse case, failure mode, or product credibility risk.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required validation
      description: List tests, build, release checks, browser smoke checks, or EC2 commands.
