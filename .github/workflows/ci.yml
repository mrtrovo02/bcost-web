name: bCost Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bcost-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.bcost.com.br/api/v1
      NEXT_PUBLIC_API_BASE_URL: https://api.bcost.com.br/api/v1
      NEXT_PUBLIC_APP_URL: https://app.bcost.com.br
      NEXT_PUBLIC_SOCKET_URL: https://api.bcost.com.br
      INTERNAL_API_URL: http://127.0.0.1:5000
      NEXT_PUBLIC_ENABLE_DEMO: "false"
      NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "false"
      NEXT_PUBLIC_DEMO_ACCESS_MODE: disabled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan versioned security configuration
        run: npm run security:scan

      - name: Validate production environment contract
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused release tests
        run: npm run test:release

      - name: Run session contract tests
        run: npm run test:session

      - name: Build
        run: npm run build
