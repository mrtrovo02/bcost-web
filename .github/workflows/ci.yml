name: bCost Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bcost-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.bcost.com.br/api/v1
      NEXT_PUBLIC_API_BASE_URL: https://api.bcost.com.br/api/v1
      NEXT_PUBLIC_APP_URL: https://app.bcost.com.br
      NEXT_PUBLIC_SOCKET_URL: https://api.bcost.com.br
      INTERNAL_API_URL: http://127.0.0.1:5000
      BUILD_VERSION: ci-${{ github.sha }}
      NEXT_PUBLIC_BUILD_VERSION: ci-${{ github.sha }}
      NEXT_PUBLIC_RELEASE_STAGE: beta
      NEXT_PUBLIC_ENABLE_DEMO: "false"
      NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "false"
      NEXT_PUBLIC_DEMO_ACCESS_MODE: disabled

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Run predeploy production gate
        run: npm run predeploy:full
